name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          PORTFOLIO_NAME: ${{ vars.PORTFOLIO_NAME }}
          PORTFOLIO_ROLE: ${{ vars.PORTFOLIO_ROLE }}
          PORTFOLIO_DESCRIPTION: ${{ vars.PORTFOLIO_DESCRIPTION }}
          PORTFOLIO_EMAIL: ${{ vars.PORTFOLIO_EMAIL }}
          PORTFOLIO_GITHUB: ${{ vars.PORTFOLIO_GITHUB }}
          PORTFOLIO_LINKEDIN: ${{ vars.PORTFOLIO_LINKEDIN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
