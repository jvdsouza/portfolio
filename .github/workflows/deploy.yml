name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install

      - name: Write environment file
        run: |
          echo "PORTFOLIO_NAME=${{ secrets.PORTFOLIO_NAME }}" >> .env
          echo "PORTFOLIO_ROLE=${{ secrets.PORTFOLIO_ROLE }}" >> .env
          echo "PORTFOLIO_DESCRIPTION=${{ secrets.PORTFOLIO_DESCRIPTION }}" >> .env
          echo "PORTFOLIO_EMAIL=${{ secrets.PORTFOLIO_EMAIL }}" >> .env
          echo "PORTFOLIO_GITHUB=${{ secrets.PORTFOLIO_GITHUB }}" >> .env
          echo "PORTFOLIO_LINKEDIN=${{ secrets.PORTFOLIO_LINKEDIN }}" >> .env

      - name: Build
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
